<!DOCTYPE html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Reseña</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        line-height: 1.6;
      }

      .container {
        flex: 1;
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        font-size: 2.2rem;
        font-weight: 300;
        margin-bottom: 2rem;
        text-align: center;
        color: #ffffff;
        letter-spacing: 1px;
      }

      .form-container {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 40px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 500;
        font-size: 1rem;
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #ffffff;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }

      input[type="text"]::placeholder,
      textarea::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .form-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
      }

      .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        min-width: 120px;
      }

      .btn-primary {
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      .btn-primary:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.8);
        border: 2px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      .error-list {
        list-style: none;
        margin-top: 8px;
      }

      .error-list li {
        color: #ff6b6b;
        font-size: 0.9rem;
        margin-bottom: 4px;
      }

      footer {
        background: rgba(0, 0, 0, 0.3);
        text-align: center;
        padding: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px 15px;
        }

        h1 {
          font-size: 1.8rem;
        }

        .form-container {
          padding: 25px;
        }

        .form-buttons {
          flex-direction: column;
          align-items: center;
        }

        .btn {
          width: 100%;
          max-width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Agregar Nueva Reseña</h1>

      <div class="form-container">
        <form method="post" novalidate>
          {% csrf_token %}

          {% for field in form %}
            <div class="form-group">
              <label for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <ul class="error-list">
                  {% for error in field.errors %}
                    <li>{{ error }}</li>
                  {% endfor %}
                </ul>
              {% endif %}
            </div>
          {% endfor %}

          <div class="form-buttons">
            <button type="submit" class="btn btn-primary">Guardar Reseña</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <p>Proyecto desarrollado por <strong>Cibertec Lima, Perú</strong><br>
      Curso de Inteligencia Artificial</p>
    </footer>
  </body>
</html>

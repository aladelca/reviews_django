<!DOCTYPE html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Reseñas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        line-height: 1.6;
      }

      .container {
        flex: 1;
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        font-size: 2.2rem;
        font-weight: 300;
        margin-bottom: 2rem;
        text-align: center;
        color: #ffffff;
        letter-spacing: 1px;
      }

      .table-container {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .reviews-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }

      .reviews-table th {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        padding: 15px 20px;
        text-align: left;
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: 0.5px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      }

      .reviews-table td {
        padding: 15px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
      }

      .reviews-table tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .id-column {
        width: 80px;
        text-align: center;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
      }

      .review-column {
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .nav-link {
        display: inline-block;
        padding: 12px 30px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        text-decoration: none;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        transition: all 0.3s ease;
        font-size: 1rem;
        font-weight: 400;
        backdrop-filter: blur(10px);
        margin-top: 20px;
      }

      .nav-link:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.4);
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.1rem;
      }

      footer {
        background: rgba(0, 0, 0, 0.3);
        text-align: center;
        padding: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px 15px;
        }

        h1 {
          font-size: 1.8rem;
        }

        .table-container {
          padding: 20px;
        }

        .reviews-table th,
        .reviews-table td {
          padding: 10px 15px;
          font-size: 0.9rem;
        }

        .id-column {
          width: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Lista de Reseñas</h1>

      <div class="table-container">
        {% if reviews %}
          <table class="reviews-table">
            <thead>
              <tr>
                <th class="id-column">ID</th>
                <th class="review-column">Reseña</th>
              </tr>
            </thead>
            <tbody>
              {% for r in reviews %}
              <tr>
                <td class="id-column">{{r.id}}</td>
                <td class="review-column">{{r.review}}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        {% else %}
          <div class="empty-state">
            <p>No hay reseñas disponibles</p>
          </div>
        {% endif %}
      </div>

      <a href="{% url 'index' %}" class="nav-link">← Volver al Inicio</a>
    </div>

    <footer>
      <p>Proyecto desarrollado en <strong>Cibertec Lima, Perú</strong><br>
      Curso de Inteligencia Artificial</p>
    </footer>
  </body>
</html>
